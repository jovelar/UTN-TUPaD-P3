<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Mis Pedidos</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="contenedor_body">
    <header>
        <nav class="nav">
            <h1 class="nav__brand">Food Store</h1>
            <ul class="nav__links">
                <li class="nav__link"><a href="/src/pages/store/home/home.html">Inicio</a></li>
                <li class="nav__link nav__link--pedidos"><a href="/src/pages/client/orders/orders.html">Mis Pedidos</a></li>
                <li class="nav__link"><a href="/src/pages/store/cart/cart.html">Carrito (<span id="cartCount">0</span>)</a></li>
                <li class="nav__link" id="adminLink" style="display:none"><a href="/src/pages/admin/adminHome/adminHome.html">Administración</a></li>
                <li class="nav__link"><span id="userName"></span></li>
                <li class="nav__link"><button id="logoutButton">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <main class="cart">
        <div class="order-header">
            <h2>Mis Pedidos</h2>
            <select id="filtroEstado">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="CONFIRMADO">Confirmado</option>
                <option value="TERMINADO">Terminado</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
        </div>

        <section id="listaPedidos">
            <!-- carga desde order.ts -->
        </section>
    </main>

    <!-- detalle de pedido -->
    <div id="modalDetalle" class="modal" style="display:none">
        <div class="modal__content">
            <button id="cerrarModal" class="modal__close">×</button>
            <div id="modalContenido"></div>
        </div>
    </div>

    <footer></footer>
    <script type="module" src="./orders.ts"></script>
</body>
</html>
