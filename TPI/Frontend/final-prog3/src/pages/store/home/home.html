<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <header>
        <nav class="nav">
            <h1 class="nav__brand">Food Store</h1>
            <ul class="nav__links">
                <li class="nav__link"><a href="/src/pages/store/home/home.html">Inicio</a></li>
                <li class="nav__link"><a href="/src/pages/client/orders/orders.html">Mis Pedidos</a></li>
                <li class="nav__link"><a href="/src/pages/store/cart/cart.html">Carrito (<span id="cartCount">0</span>)</a></li>
                <li class="nav__link" id="adminLink" style="display:none"><a href="/src/pages/admin/adminHome/adminHome.html">Administración</a></li>
                <li class="nav__link"><button id="logoutButton">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <div class="store">
        <aside class="store__sidebar">
            <h3>Categorías</h3>
            <ul class="store__categories" id="listaDeCategorias"></ul>
        </aside>
        <main class="store__content">
            <div class="store__toolbar">
                <input type="text" id="busqueda" class="store__search" placeholder="Buscar productos...">
                <select id="ordenar" class="store__select">
                    <option value="">Ordenar por</option>
                    <option value="nombre-asc">Nombre A-Z</option>
                    <option value="nombre-desc">Nombre Z-A</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                </select>
                <select id="filtroCategoria" class="store__select">
                    <option value="">Todos</option>
                </select>
            </div>
            <section id="listaDeProductos" class="store__products"></section>
        </main>
    </div>

    <footer>Datos food store</footer>
    <script type="module" src="./home.ts"></script>
</body>
</html>
